LoadModule ldap_module modules/mod_ldap.so
LoadModule authnz_ldap_module modules/mod_authnz_ldap.so

LDAPTrustedClientCert CERT_BASE64 /etc/openldap/cacerts/client.pem
LDAPTrustedClientCert KEY_BASE64 /etc/openldap/cacerts/client.pem

LDAPVerifyServerCert on
LDAPTrustedMode SSL



<Directory "/var/www/html/Logadmin">

             AllowOverride None
             Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
             Order allow,deny
             Allow from all
             AddHandler cgi-script .py              # tell Apache to handle every file with .py suffix as a cgi program
             AddHandler default-handler .html .htm .css # tell Apache to handle HTML files in regular way

            #Login aganist LDAP
            AllowOverride None
            Order allow,deny
            Allow from all
            AuthType Basic
            AuthName "Enter the password!"
            AuthBasicProvider ldap
            AuthzLDAPAuthoritative on
            AuthLDAPGroupAttributeIsDN off
            AuthLDAPBindDN ${BIND_DN}
            AuthLDAPBindPassword ${BIND_PASSWORD}
            AuthLDAPURL ${LDAP_URL}
            Require valid-user



</Directory>

# False-positive SQL injection.
SecRuleRemoveById 950901

# Allow browsing on ip.
SecRuleRemoveById 960017